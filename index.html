<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>蓝星纪元</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@700;900&display=swap">
<style>
:root{
  /* Layout: observatory console. The planet floats on a dark stage at left; an instrument rail of readouts runs down the right. */
  --space:#060a14;
  --stage-glow:#0d1a36;
  --panel:#0b1324;
  --panel-2:#111c33;
  --panel-3:#16233f;
  --line:#1f2d4a;
  --ink:#e9eef8;
  --ink-2:#a6b3cc;
  --ink-3:#6f7e9b;
  --sodium:#ffb547;
  --sodium-dim:rgba(255,181,71,.14);
  --sea:#5cc4e6;
  --leaf:#7fd18b;
  --ember:#ff8a4c;
  --blood:#ff5f6b;
  --violet:#b8a2ff;
  --series-1:#3987e5;
  --mix-coal:#3987e5;
  --mix-oil:#d95926;
  --mix-nuke:#199e70;
  --mix-renew:#c98500;
  --mix-fusion:#d55181;
  --status-serious:#ec835a;
  --font-display:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --font-body:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--space);color:var(--ink);font:14px/1.55 var(--font-body);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--sodium);outline-offset:2px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr);height:100%}

/* ---------- header ---------- */
.bar{grid-column:1/-1;display:flex;align-items:center;gap:12px 24px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;min-width:0}
.brand h1{margin:0;font-family:var(--font-display);font-weight:900;font-size:22px;line-height:1.15;letter-spacing:.14em;text-wrap:balance}
.brand .sub{margin:0;color:var(--ink-3);font-size:12px;letter-spacing:.04em}
.clock{flex:1;display:flex;align-items:baseline;justify-content:center;gap:14px;min-width:0}
.year{font-size:22px;font-weight:500;color:var(--sodium);letter-spacing:.02em;white-space:nowrap}
.era{color:var(--ink-2);font-size:13px;white-space:nowrap}
.era b{color:var(--ink);font-weight:500}
.ctrl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:6px;border:1px solid var(--line);background:var(--panel-2);cursor:pointer;font-size:13px;color:var(--ink)}
.btn:hover{background:var(--panel-3)}
.btn.icon{width:36px;padding:0}
.btn svg{width:14px;height:14px;fill:currentColor}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel-2)}
.seg button{height:30px;padding:0 10px;border:0;background:transparent;cursor:pointer;font-size:13px;color:var(--ink-2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button:hover{color:var(--ink);background:var(--panel-3)}
.seg button[aria-pressed="true"]{color:var(--sodium);background:var(--sodium-dim)}

/* ---------- stage ---------- */
.stage{position:relative;overflow:hidden;min-height:0;background:radial-gradient(ellipse at 45% 48%,var(--stage-glow) 0%,var(--space) 68%)}
#view{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#view.dragging{cursor:grabbing}
#view.tool{cursor:crosshair}
.overlay{position:absolute;z-index:2}
.ticker{top:14px;left:50%;transform:translateX(-50%);max-width:min(640px,calc(100% - 220px));padding:7px 14px;border-radius:999px;background:rgba(11,19,36,.82);border:1px solid var(--line);font-size:13px;color:var(--ink);text-align:center;transition:opacity .5s;pointer-events:none;backdrop-filter:blur(6px)}
.ticker .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:8px;vertical-align:1px}
.ticker[data-empty="1"]{opacity:0}
.god{top:14px;left:max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.god .lbl{font-size:11px;letter-spacing:.12em;color:var(--ink-3)}
.god .tools{display:flex;flex-direction:column;gap:4px}
.god button{height:28px;padding:0 10px;border-radius:6px;border:1px solid var(--line);background:rgba(17,28,51,.85);cursor:pointer;font-size:12px;color:var(--ink-2);text-align:left;min-width:84px}
.god button:hover{color:var(--ink)}
.god button[aria-pressed="true"]{color:var(--space);background:var(--sodium);border-color:var(--sodium)}
.god .hint{font-size:12px;color:var(--sodium);max-width:180px}
.dock{left:max(16px,env(safe-area-inset-left,0px));bottom:14px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;max-width:calc(100% - 80px)}
.dock .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toggles{display:flex;gap:4px;flex-wrap:wrap}
.toggles label{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:1px solid var(--line);border-radius:6px;background:rgba(17,28,51,.85);font-size:12px;color:var(--ink-2);cursor:pointer;user-select:none}
.toggles input{accent-color:var(--sodium);margin:0}
.dock .seg{background:rgba(17,28,51,.85)}
.zoom{right:max(16px,env(safe-area-inset-right,0px));bottom:14px;display:flex;flex-direction:column;gap:4px}
.zoom button{width:32px;height:32px;border-radius:6px;border:1px solid var(--line);background:rgba(17,28,51,.85);cursor:pointer;font-size:16px;color:var(--ink-2)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;padding:8px 10px;border-radius:6px;background:rgba(11,19,36,.85);border:1px solid var(--line);font-size:12px;color:var(--ink-2);max-width:420px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.legend .ramp{display:flex;align-items:center;gap:8px;width:100%}
.legend .ramp span.bar{flex:1;height:8px;border-radius:2px;min-width:120px}
.insp{top:60px;right:max(16px,env(safe-area-inset-right,0px));width:280px;max-width:calc(100% - 32px);padding:14px 14px 12px;border-radius:8px;background:rgba(11,19,36,.94);border:1px solid var(--line);box-shadow:0 12px 40px rgba(0,0,0,.45);backdrop-filter:blur(8px)}
.insp h2{margin:0 0 2px;font-family:var(--font-display);font-size:18px;font-weight:700;letter-spacing:.06em;padding-right:24px}
.insp .meta{color:var(--ink-3);font-size:12px;margin-bottom:10px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.insp .close{position:absolute;top:8px;right:8px;width:26px;height:26px;border:0;border-radius:4px;background:transparent;cursor:pointer;color:var(--ink-3);font-size:18px;line-height:1}
.insp .close:hover{color:var(--ink);background:var(--panel-3)}
.insp dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0;font-size:13px}
.insp dt{color:var(--ink-3)}
.insp dd{margin:0;text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums;color:var(--ink)}
.insp .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
.tag{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);font-size:11px;color:var(--ink-2);background:var(--panel-2)}
.swatch{display:inline-block;width:10px;height:10px;border-radius:2px;flex:none}
.hovertip{pointer-events:none;padding:3px 8px;border-radius:4px;background:rgba(6,10,20,.9);border:1px solid var(--line);font-size:12px;color:var(--ink);white-space:nowrap;transform:translate(10px,-50%)}
.banner{left:50%;top:42%;transform:translate(-50%,-50%);padding:18px 26px;border-radius:10px;background:rgba(6,10,20,.88);border:1px solid var(--sodium);text-align:center;pointer-events:none;transition:opacity .8s}
.banner h3{margin:0;font-family:var(--font-display);font-size:24px;letter-spacing:.12em;color:var(--sodium)}
.banner p{margin:6px 0 0;color:var(--ink-2);font-size:13px}

/* ---------- rail ---------- */
.rail{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-left:1px solid var(--line)}
.tabs{display:flex;gap:2px;padding-block:8px 0;padding-left:16px;padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;height:36px;border:0;background:transparent;cursor:pointer;color:var(--ink-3);font-size:14px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--sodium)}
.pane{flex:1;overflow:auto;padding-block:14px 28px;padding-left:16px;padding-right:max(16px,env(safe-area-inset-right,0px));min-height:0}
.pane h3{margin:22px 0 10px;font-size:12px;font-weight:500;letter-spacing:.14em;color:var(--ink-3);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pane h3:first-child{margin-top:4px}
.pane h3 small{font-size:12px;letter-spacing:0;color:var(--ink-3);font-weight:400}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.kpi{background:var(--panel);padding:9px 10px;display:flex;flex-direction:column;gap:1px;min-width:0}
.kpi.wide{grid-column:1/-1;flex-direction:row;align-items:baseline;justify-content:space-between;gap:8px}
.kpi .k{font-size:12px;color:var(--ink-3)}
.kpi .v{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:16px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.wide .v{font-size:24px;color:var(--sodium)}
.kpi .d{font-size:11px;color:var(--ink-3);font-family:var(--font-mono)}
.spark{position:relative;height:96px;margin-top:6px}
.spark canvas{width:100%;height:100%;display:block}
.spark .tip{position:absolute;top:0;pointer-events:none;padding:2px 7px;border-radius:4px;background:var(--panel-3);border:1px solid var(--line);font-size:11px;font-family:var(--font-mono);color:var(--ink);white-space:nowrap;transform:translateX(-50%)}
.sparkhead{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--ink-2);margin-top:12px}
.sparkhead b{font-family:var(--font-mono);font-weight:500;color:var(--ink)}
.mixbar{display:flex;height:14px;border-radius:3px;overflow:hidden;gap:2px;background:var(--panel)}
.mixbar span{display:block;height:100%;min-width:0}
.mixlegend{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:4px 12px;margin-top:8px;font-size:12px;color:var(--ink-2)}
.mixlegend div{display:flex;align-items:center;gap:6px}
.mixlegend b{margin-left:auto;font-family:var(--font-mono);font-weight:400;color:var(--ink)}
.res{display:grid;grid-template-columns:52px 1fr 64px;gap:6px 10px;align-items:center;font-size:12px}
.res .name{color:var(--ink-2)}
.res .track{height:6px;border-radius:3px;background:var(--panel-3);overflow:hidden}
.res .fill{height:100%;background:var(--ink-2);border-radius:3px}
.res .fill.low{background:var(--status-serious)}
.res .pct{text-align:right;font-family:var(--font-mono);color:var(--ink)}
.res .pct.low{color:var(--status-serious)}
.note{font-size:12px;color:var(--ink-3);margin:6px 0 0}

.nat{border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin-bottom:8px;cursor:pointer;background:var(--panel)}
.nat:hover{background:var(--panel-2)}
.nat[aria-expanded="true"]{background:var(--panel-2);border-color:var(--ink-3)}
.nat .top{display:flex;align-items:center;gap:8px}
.nat .nm{font-weight:500;font-size:14px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nat .pp{font-family:var(--font-mono);font-size:13px;color:var(--ink)}
.nat .sub{display:flex;gap:10px;font-size:12px;color:var(--ink-3);margin-top:4px;flex-wrap:wrap}
.nat .war{color:var(--blood)}
.nat .prog{margin-top:8px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2)}
.nat .prog .track{flex:1;height:4px;border-radius:2px;background:var(--panel-3);overflow:hidden}
.nat .prog .fill{height:100%;background:var(--sea)}
.nat .more{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12px}
.nat .more dt{color:var(--ink-3)}
.nat .more dd{margin:0;text-align:right;font-family:var(--font-mono);color:var(--ink)}
.dead{opacity:.55}

.era-group{margin-bottom:16px}
.era-group h4{margin:0 0 8px;font-size:12px;font-weight:500;color:var(--ink-2);letter-spacing:.08em;display:flex;justify-content:space-between}
.era-group h4 span{color:var(--ink-3);font-weight:400;letter-spacing:0}
.techs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.tech{position:relative;border:1px solid var(--line);border-radius:6px;padding:7px 9px 8px;background:var(--panel);overflow:hidden;min-width:0}
.tech .tn{font-size:13px;color:var(--ink-3)}
.tech .tw{font-size:11px;color:var(--ink-3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tech .tb{position:absolute;left:0;bottom:0;height:2px;background:var(--sea)}
.tech.known{border-color:#2b4f6a;background:#0f2034}
.tech.known .tn{color:var(--ink)}
.tech.known .tw{color:var(--ink-2)}
.tech.cur{border-color:var(--sea)}
.techhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;font-size:12px;color:var(--ink-2)}
.techhead select{background:var(--panel-2);color:var(--ink);border:1px solid var(--line);border-radius:6px;height:30px;padding:0 8px;font:inherit;font-size:12px;max-width:60%}

.chips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px}
.chips button{height:26px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:12px;color:var(--ink-2)}
.chips button[aria-pressed="true"]{border-color:var(--sodium);color:var(--sodium)}
.log{list-style:none;margin:0;padding:0}
.log li{display:grid;grid-template-columns:76px 10px 1fr;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px;align-items:baseline}
.log .y{font-family:var(--font-mono);font-size:12px;color:var(--ink-3);text-align:right}
.log .dot{width:7px;height:7px;border-radius:50%;align-self:center}
.log .t{color:var(--ink);min-width:0}
.log li[data-cell]{cursor:pointer}
.log li[data-cell]:hover .t{color:var(--sodium)}

/* ---------- phone ---------- */
@media (max-width:900px){
  body{overflow:auto}
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto;height:auto;min-height:100%}
  .stage{height:66vh;min-height:380px}
  .rail{border-left:0;border-top:1px solid var(--line)}
  .pane{overflow:visible}
  .clock{justify-content:flex-start;order:3;flex-basis:100%}
  .ctrl{margin-left:auto}
  .ticker{max-width:calc(100% - 32px);width:max-content;top:76px;font-size:12px}
  .god .tools{flex-direction:row;flex-wrap:wrap}
  .god button{min-width:0}
  .insp{top:auto;bottom:14px;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));width:auto;max-height:55%;overflow:auto;z-index:4}
}
@media (max-width:520px){
  .seg button{padding:0 8px}
  .brand h1{font-size:19px}
  .year{font-size:19px}
}
@media (prefers-reduced-motion:reduce){
  .ticker,.banner{transition:none}
}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="bar">
    <div class="brand">
      <h1>蓝星纪元</h1>
      <p class="sub">一颗自己运转的星球 · 世界种子 <span class="mono" id="seedLabel"></span></p>
    </div>
    <div class="clock">
      <div class="year mono" id="yearLabel">公元前 3500 年</div>
      <div class="era" id="eraLabel"></div>
    </div>
    <div class="ctrl">
      <button class="btn icon" id="btnPlay" aria-label="暂停" title="暂停 / 继续（空格）"></button>
      <div class="seg" id="speedSeg" role="group" aria-label="模拟速度">
        <button data-speed="auto" aria-pressed="true" title="按时代自动调节">自动</button>
        <button data-speed="2" aria-pressed="false" title="每秒 2 年">慢</button>
        <button data-speed="10" aria-pressed="false" title="每秒 10 年">中</button>
        <button data-speed="40" aria-pressed="false" title="每秒 40 年">快</button>
        <button data-speed="150" aria-pressed="false" title="每秒 150 年">极速</button>
      </div>
      <button class="btn" id="btnNew" title="用新的种子生成另一颗星球">新世界</button>
    </div>
  </header>

  <main class="stage" id="stage">
    <canvas id="view" aria-label="行星视图。拖动旋转，滚轮缩放，点击城市查看详情。"></canvas>
    <div class="overlay ticker" id="ticker" data-empty="1" aria-live="polite"></div>
    <div class="overlay god" id="god">
      <span class="lbl">上帝之手</span>
      <div class="tools">
        <button data-tool="inspire" aria-pressed="false" title="点击一座城市，让它的国家获得科研灵感">灵感</button>
        <button data-tool="plague" aria-pressed="false" title="点击一座城市，向它的国家降下瘟疫">瘟疫</button>
        <button data-tool="meteor" aria-pressed="false" title="点击任意位置，召唤一颗陨石">陨石</button>
        <button data-tool="seed" aria-pressed="false" title="点击无人陆地，播下一个新文明">播种文明</button>
      </div>
      <span class="hint" id="toolHint" hidden></span>
    </div>
    <div class="overlay dock">
      <div class="legend" id="legend" hidden></div>
      <div class="row">
        <div class="seg" id="layerSeg" role="group" aria-label="图层">
          <button data-layer="0" aria-pressed="true">自然</button>
          <button data-layer="1" aria-pressed="false">政治</button>
          <button data-layer="2" aria-pressed="false">资源</button>
          <button data-layer="3" aria-pressed="false">人口</button>
          <button data-layer="4" aria-pressed="false">气候</button>
        </div>
        <div class="toggles">
          <label><input type="checkbox" id="tClouds" checked> 云层</label>
          <label><input type="checkbox" id="tNight" checked> 昼夜</label>
          <label><input type="checkbox" id="tSpin" checked> 自转</label>
        </div>
      </div>
    </div>
    <div class="overlay zoom">
      <button id="zIn" aria-label="放大">+</button>
      <button id="zOut" aria-label="缩小">−</button>
    </div>
    <div class="overlay insp" id="insp" hidden></div>
    <div class="overlay hovertip" id="hoverTip" hidden></div>
    <div class="overlay banner" id="banner" hidden></div>
  </main>

  <aside class="rail">
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="ov" aria-selected="true">总览</button>
      <button role="tab" data-tab="nat" aria-selected="false">文明</button>
      <button role="tab" data-tab="tech" aria-selected="false">科技</button>
      <button role="tab" data-tab="log" aria-selected="false">编年史</button>
    </nav>

    <section class="pane" id="pane-ov" role="tabpanel">
      <h3>人类</h3>
      <div class="kpis">
        <div class="kpi wide"><span class="k">世界人口</span><span class="v" id="kPop">—</span></div>
        <div class="kpi"><span class="k">文明</span><span class="v" id="kNat">—</span></div>
        <div class="kpi"><span class="k">城市</span><span class="v" id="kCity">—</span></div>
        <div class="kpi"><span class="k">领先时代</span><span class="v" id="kEra">—</span></div>
        <div class="kpi"><span class="k">工厂</span><span class="v" id="kFac">—</span></div>
        <div class="kpi"><span class="k">研究所</span><span class="v" id="kLab">—</span></div>

    const l = tElev[ty * TW + (tx + TW - 1) % TW], r = tElev[ty * TW + (tx + 1) % TW];
    const u = tElev[Math.max(0, ty - 1) * TW + tx], d = tElev[Math.min(TH - 1, ty + 1) * TW + tx];
    tShade[i] = clamp(1 + ((r - l) + (d - u)) * 7, 0.72, 1.3);
  }
  // simulation cells = 4×4 texel averages
  const elev = new Float32Array(N), cT = new Float32Array(N), moist = new Float32Array(N), biome = new Uint8Array(N);
  const fert0 = new Float32Array(N), forest0 = new Float32Array(N), fish = new Float32Array(N);
  const minTE = new Float32Array(N), minTT = new Float32Array(N);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    let se = 0, st = 0, sm = 0, mn = 9, mt = 99;
    for (let sy = 0; sy < TS; sy++) for (let sx = 0; sx < TS; sx++) {
      const ti = (y * TS + sy) * TW + x * TS + sx;
      se += tElev[ti]; st += tT[ti]; sm += tM[ti]; if (tElev[ti] < mn) mn = tElev[ti]; if (tT[ti] < mt) mt = tT[ti];
    }
    const i = y * W + x, k = TS * TS;
    elev[i] = se / k; cT[i] = st / k; moist[i] = sm / k; minTE[i] = mn; minTT[i] = mt;
    biome[i] = elev[i] > 0 ? classify(elev[i], cT[i], moist[i], mtn) : (elev[i] > -0.1 ? B.SHALLOW : B.DEEP);
    fert0[i] = BIOME_FERT[biome[i]] * (0.75 + 0.5 * moist[i]);
    forest0[i] = BIOME_FOREST[biome[i]];
  }
  // fish & mineral deposits
  const res0 = {}; for (const r of RES) res0[r] = new Float32Array(N);
  const cand = { coal: [], oil: [], iron: [], uran: [], rare: [] };
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x, lat = CELL_LAT[y], lon = cellLon(x), cl = Math.cos(lat);
    const px = cl * Math.cos(lon), py = Math.sin(lat), pz = cl * Math.sin(lon);
    const b = biome[i], land = elev[i] > 0;
    if (b === B.SHALLOW) fish[i] = clamp(0.45 + 0.6 * fbm(nR, px * 4, py * 4, pz * 4, 2) + (Math.abs(lat) > 0.6 ? 0.15 : 0), 0.1, 1);
    if (land && b !== B.ICE) {
      if ([B.FOREST, B.TAIGA, B.GRASS, B.STEPPE, B.TUNDRA].includes(b) && elev[i] < 0.5) cand.coal.push([i, fbm(nC, px * 3 + 5, py * 3, pz * 3, 3)]);
      if ([B.DESERT, B.STEPPE, B.TUNDRA, B.SAVANNA, B.JUNGLE].includes(b)) cand.oil.push([i, fbm(nR, px * 3.3, py * 3.3 + 7, pz * 3.3, 3)]);
      if (elev[i] > 0.1) cand.iron.push([i, fbm(nW, px * 4 + 3, py * 4, pz * 4 - 3, 3)]);
      cand.uran.push([i, fbm(nM, px * 5 + 9, py * 5, pz * 5, 3)]);
      if (elev[i] > 0.06) cand.rare.push([i, fbm(nT, px * 5 + 11, py * 5, pz * 5, 3)]);
    }
    if (b === B.SHALLOW) cand.oil.push([i, fbm(nR, px * 3.3, py * 3.3 + 7, pz * 3.3, 3) - 0.04]);
  }
  const share = { coal: 0.16, oil: 0.13, iron: 0.14, uran: 0.05, rare: 0.06 };
  const resTotal = {};
  for (const r of RES) {
    const c = cand[r].sort((a, b) => b[1] - a[1]);
    const k = Math.max(4, (c.length * share[r]) | 0), thr = c[Math.min(k, c.length - 1)][1], top = c[0][1];
    let sum = 0;
    for (let j = 0; j < k && j < c.length; j++) { const v = 0.35 + (c[j][1] - thr) / (top - thr + 1e-6); res0[r][c[j][0]] = v; sum += v; }
    const scale = RES_TOTAL[r] / sum;
    for (let i = 0; i < N; i++) res0[r][i] *= scale;
    resTotal[r] = RES_TOTAL[r];
  }
  // clouds
  const CW0 = 512, CH0 = 256, craw = new Float32Array(CW0 * CH0);
  for (let y = 0; y < CH0; y++) {
    const lat = PI / 2 - (y + 0.5) / CH0 * PI, sl = Math.sin(lat), cl = Math.cos(lat), ld = Math.abs(lat * 180 / PI);
    const band = 0.08 * Math.exp(-ld * ld / 60) + 0.1 * Math.exp(-(ld - 52) * (ld - 52) / 120) - 0.08 * Math.exp(-(ld - 25) * (ld - 25) / 80);
    for (let x = 0; x < CW0; x++) {
      const lon = (x + 0.5) / CW0 * TAU - PI;
      craw[y * CW0 + x] = fbm(nC, cl * Math.cos(lon) * 2.6 + 3, sl * 2.6 * 1.4, cl * Math.sin(lon) * 2.6 - 3, 6) + band;
    }
  }
  const cloud = new Uint8Array(CW * CH);
  for (let y = 0; y < CH; y++) {
    const sy = clamp((y + 0.5) / CH * CH0 - 0.5, 0, CH0 - 1), y0 = Math.floor(sy), y1 = Math.min(CH0 - 1, y0 + 1), fy = sy - y0;
    for (let x = 0; x < CW; x++) {
      const sx = (x + 0.5) / CW * CW0 - 0.5, xf = Math.floor(sx), fx = sx - xf;
      const x0 = (xf + CW0) % CW0, x1 = (x0 + 1) % CW0;
      const a = craw[y0 * CW0 + x0] + (craw[y0 * CW0 + x1] - craw[y0 * CW0 + x0]) * fx;
      const b = craw[y1 * CW0 + x0] + (craw[y1 * CW0 + x1] - craw[y1 * CW0 + x0]) * fx;
      cloud[y * CW + x] = Math.round(smooth(0.03, 0.3, a + (b - a) * fy) * 225);
    }
  }
  return { seed, tElev, tT, tBiome, tHash, tHash2, tShade, elev, cT, moist, biome, fert0, forest0, fish, res0, resTotal, minTE, minTT, cloud, mtn };
}

function classify(e, T, m, mtn) {
  if (T < -10) return B.ICE;
  if (e > mtn) return B.MOUNTAIN;
  if (T < -2) return B.TUNDRA;
  if (T < 5) return m > 0.42 ? B.TAIGA : B.STEPPE;
  if (T < 18) return m < 0.27 ? B.DESERT : m < 0.43 ? B.STEPPE : m < 0.57 ? B.GRASS : B.FOREST;
  return m < 0.3 ? B.DESERT : m < 0.45 ? B.SAVANNA : m < 0.6 ? B.GRASS : B.JUNGLE;
}

/* =====================================================================
   Simulation state
   ===================================================================== */
const best = new Float32Array(N);
const prevOwner = new Int16Array(N);

const isLand = i => WORLD.elev[i] > S.seaRise;
const isShallow = i => WORLD.elev[i] <= S.seaRise && WORLD.elev[i] > S.seaRise - 0.1;
const cellTeff = i => WORLD.cT[i] + S.tanom * AMP_CELL[(i / W) | 0];
function neighbors4(i) { const y = (i / W) | 0, x = i - y * W; const out = [y * W + (x + 1) % W, y * W + (x + W - 1) % W]; if (y > 0) out.push(i - W); if (y < H - 1) out.push(i + W); return out; }
function isCoastal(i) { for (const j of neighbors4(i)) if (!isLand(j)) return true; return false; }
function nearBiome(i, b, r) {
  const y0 = (i / W) | 0, x0 = i - y0 * W;
  for (let dy = -r; dy <= r; dy++) { const y = y0 + dy; if (y < 0 || y >= H) continue; for (let dx = -r; dx <= r; dx++) if (WORLD.biome[y * W + (x0 + dx + W) % W] === b) return true; }
  return false;
}

function newState(seed) {
  WORLD = genWorld(seed);
  S = {
    v: 1, seed, year: START_YEAR, tick: 0, rng: (seed ^ 0x9e3779b9) | 0,
    co2: 280, tanom: 0, seaRise: 0, co2Peak: 280,
    cities: [], nations: [], wars: [], log: [], history: [], firsts: {}, names: {}, flags: { maxEra: 0 },
    forest: WORLD.forest0.slice(), res: {}, owner: new Int16Array(N).fill(-1), cityOf: new Int16Array(N).fill(-1),
    farm: new Float32Array(N), smog: new Float32Array(N),
    nextCity: 1, sats: 0, orbital: 0, orbPop: 0, ships: 0, moon: null, moonDue: 0, moonBy: -1, forestFrac: 1,
    resLeft: {}, deforest: 0, terrDirty: true, borders: [], lastShip: 0,
  };
  for (const r of RES) { S.res[r] = WORLD.res0[r].slice(); S.resLeft[r] = WORLD.resTotal[r]; }
  seedCivs();
}

function seedCivs() {
  const starts = [];
  for (let minD = 24; starts.length < 7 && minD > 8; minD -= 4) {
    for (let t = 0; t < 6000 && starts.length < 7; t++) {
      const i = (rand() * N) | 0; if (!isLand(i)) continue;
      const y = (i / W) | 0; if (Math.abs(CELL_LAT[y]) > 0.95) continue;
      if (WORLD.fert0[i] < 0.55 || WORLD.biome[i] === B.MOUNTAIN) continue;
      if (starts.some(j => cellDist(i, j) < minD)) continue;
      starts.push(i);
    }
  }
  S.firsts.agri = { n: -1, name: '各部落', y: START_YEAR };
  for (const i of starts) { const n = createNation(null); createCity(i, n.id, 150000 + rand() * 100000, true); }
  log('civ', `${starts.length} 个部落在大河两岸定居，人类文明由此开始`, starts[0]);
}

function createNation(techsFrom) {
  const id = S.nations.length;
  const col = NATION_COLORS[id % NATION_COLORS.length];
  const n = {
    id, name: nationName(techsFrom ? 2 : 0), color: col, rgb: hexRgb(col), techs: techsFrom ? Object.assign({}, techsFrom) : { agri: S.year },
    research: 0, target: null, alive: true, born: S.year, aggr: 0.4 + rand() * 1.2, stab: rand(),
    renew: 0, fusion: 0, nuke: 0, ccs: 0, golden: 0, capital: -1, crisis: -999, rr: 0,
    st: { pop: 0, cities: 0, fac: 0, labs: 0, rp: 0, E: 0, emit: 0, cap: 0, sat: 1, ironSat: 1, rareSat: 1, newFac: 0, mix: [0, 0, 0, 0, 0] },
  };
  n.mult = computeMult(n);
  n.dep = { coal: [], oil: [], iron: [], uran: [], rare: [] };
  n.cl = [];
  S.nations.push(n);
  return n;
}

function createCity(i, nid, pop, isCap) {
  const y = (i / W) | 0, x = i - y * W;
  const c = {
    id: S.nextCity++, name: cityName(i), n: nid, x, y, i, pop, born: S.year, fac: 0, labs: 0, cap: !!isCap,
    K: pop * 1.5, fertSum: 0, fishSum: 0, cells: 0, mines: 0, rp: 0, goods: 0, coastal: isCoastal(i), drought: 0, smog: 0,
    lat: CELL_LAT[y] + (rand() - 0.5) * 0.02, lon: cellLon(x) + (rand() - 0.5) * 0.02, links: [],
  };
  S.cities.push(c);
  if (isCap) S.nations[nid].capital = c.id;
  S.terrDirty = true;
  return c;
}

/* ---------- log ---------- */
const TYPE_COLOR = { tech: '--sea', war: '--blood', disaster: '--ember', climate: '--leaf', space: '--violet', civ: '--sodium' };
const TYPE_NAME = { tech: '科技', war: '战争', disaster: '灾害', climate: '气候', space: '太空', civ: '文明' };
let logVersion = 0;
function log(type, text, cell, major = true) {
  S.log.unshift({ y: S.year, t: type, s: text, i: cell ?? -1 });
  if (S.log.length > 400) S.log.length = 400;
  logVersion++;
  if (!booting) {
    if (cell !== undefined && cell >= 0) addFx(cell, type);
    if (major) showTicker(type, text);
  }
}

/* =====================================================================
   Territory
   ===================================================================== */
function cityRadius(c) { return clamp(1.25 + Math.sqrt(c.pop / 160000) * 0.42, 1.25, 6.5); }

function territory() {
  S.terrDirty = false;
  prevOwner.set(S.owner);
  best.fill(1e9);
  S.cityOf.fill(-1);
  const cities = S.cities;
  for (let ci = 0; ci < cities.length; ci++) {
    const c = cities[ci], R = cityRadius(c), R2 = R * R, Rs2 = R2 * 0.5, rc = Math.ceil(R);
    for (let dy = -rc; dy <= rc; dy++) {
      const y = c.y + dy; if (y < 0 || y >= H) continue;
      const cl = COSLAT[y], rx = Math.min(W / 2 - 1, Math.ceil(R / Math.max(cl, 0.2)));
      for (let dx = -rx; dx <= rx; dx++) {
        const i = y * W + (c.x + dx + W) % W;
        const ddx = dx * cl, d2 = ddx * ddx + dy * dy;
        if (d2 > R2) continue;
        const land = WORLD.elev[i] > S.seaRise;
        if (!land && (d2 > Rs2 || WORLD.elev[i] < S.seaRise - 0.1)) continue;
        const sc = Math.sqrt(d2) / R + ci * 1e-6;
        if (sc < best[i]) { best[i] = sc; S.cityOf[i] = ci; }
      }
    }
  }
  for (const n of S.nations) { for (const r of RES) n.dep[r].length = 0; }
  for (const c of cities) { c.cells = 0; c.fertSum = 0; c.fishSum = 0; c.mines = 0; }
  const bmap = new Map();
  for (let i = 0; i < N; i++) { const ci = S.cityOf[i]; S.owner[i] = ci >= 0 ? cities[ci].n : -1; }
  for (let i = 0; i < N; i++) {
    const ci = S.cityOf[i];
    const own = S.owner[i];
    if (own !== prevOwner[i]) { markDirty(i); for (const j of neighbors4(i)) markDirty(j); }
    let farm = 0, smog = 0;
    if (ci >= 0) {
      const c = cities[ci], n = S.nations[own];
      if (WORLD.elev[i] > S.seaRise) {
        c.cells++;
        c.fertSum += fertEff(i, n.mult);
        farm = FARMABLE[WORLD.biome[i]] ? clamp(c.pop / c.K, 0, 1) * clamp(WORLD.fert0[i] * 1.6, 0.2, 1) : 0;
        smog = c.smog;
      } else c.fishSum += WORLD.fish[i];
      for (const r of RES) if (S.res[r][i] > 0) { n.dep[r].push(i); c.mines++; }
    }
    if (Math.abs(farm - S.farm[i]) > 0.08) { S.farm[i] = farm; markDirty(i); }
    if (Math.abs(smog - S.smog[i]) > 0.08) { S.smog[i] = smog; if (layer === 4) markDirty(i); }
    // borders between nations
    if (own >= 0) {
      const y = (i / W) | 0, x = i - y * W;
      const o1 = S.owner[y * W + (x + 1) % W];
      if (o1 >= 0 && o1 !== own) { const k = Math.min(own, o1) * 1000 + Math.max(own, o1); bmap.set(k, (bmap.get(k) || 0) + 1); }
      if (y > 0) { const o2 = S.owner[i - W]; if (o2 >= 0 && o2 !== own) { const k = Math.min(own, o2) * 1000 + Math.max(own, o2); bmap.set(k, (bmap.get(k) || 0) + 1); } }
    }
  }
  S.borders = [...bmap].map(([k, len]) => [Math.floor(k / 1000), k % 1000, len]);
  // road links for night lights
  for (const c of cities) {
    c.links.length = 0;
    let a = null, ad = 11, b2 = null, bd = 11;
    for (const o of cities) {
      if (o === c || o.n !== c.n) continue;
      const d = cellDist(c.i, o.i);
      if (d < ad) { b2 = a; bd = ad; a = o; ad = d; } else if (d < bd) { b2 = o; bd = d; }
    }
    if (a) c.links.push(a.id); if (b2) c.links.push(b2.id);
  }
}

function fertEff(i, m) {
  const b = WORLD.biome[i];
  let f = WORLD.fert0[i];
  if (b === B.ICE) { if (cellTeff(i) > -9) f = 0.08; else return 0; }
  if (m.dry && (b === B.DESERT || b === B.STEPPE || b === B.SAVANNA)) f += 0.12;
  const t = S.tanom;
  if (t > 0) { const ct = WORLD.cT[i]; f *= ct > 20 ? 1 - 0.08 * t : ct > 10 ? 1 - 0.03 * t : 1 + 0.04 * t; }
  f *= 1 - S.forest[i] * 0.6;
  f *= 1 - Math.min(0.5, S.smog[i] * 0.5);
  return Math.max(0, f);
}

/* =====================================================================
   Yearly tick
   ===================================================================== */
const CAP_FERT = 170000, CAP_FISH = 50000;
const COAL_USE = 0.4, OIL_USE = 0.4, U_USE = 0.1, RARE_USE = 0.03, IRON_BUILD = 2, IRON_MAINT = 0.02;
const EMIT_K = 0.00034;

function tick() {
  S.tick++;
  S.year++; if (S.year === 0) S.year = 1;
  if (S.terrDirty || S.tick % 5 === 0) territory();
  for (const n of S.nations) n.cl.length = 0;
  for (const c of S.cities) S.nations[c.n].cl.push(c);
  for (const c of S.cities) cityTick(c, S.nations[c.n]);
  for (const n of S.nations) if (n.alive) nationTick(n);
  warTick();
  eventsTick();
  climateTick();
  spaceTick();
  if (S.year % 5 === 0) sampleHistory();
}

function cityTick(c, n) {
  const m = n.mult;
  let K = (c.fertSum * CAP_FERT * m.food + c.fishSum * CAP_FISH * m.fish) * (1 + 0.3 * Math.min(1, c.goods));
  if (m.orbital) K *= 1.1;
  if (c.drought > 0) { K *= 0.6; c.drought--; }
  K = Math.max(K * Math.pow(m.birth, 1.3), 15000);
  c.K = K;
  const r = m.growth * m.birth * (n.golden > 0 ? 1.15 : 1);
  if (c.pop < K) c.pop += r * c.pop * (1 - c.pop / K) + 100;
  else c.pop -= (c.pop - K) * 0.06;
  // industry
  if (m.ind > 0) {
    const target = c.pop / 1e6 * 1.1 * m.ind;
    let d = target - c.fac;
    d = d > 0 ? d * 0.05 * n.st.ironSat * (0.25 + 0.75 * n.st.sat) : d * 0.03;
    c.fac = Math.max(0, c.fac + d);
    if (d > 0) n.st.newFac += d;
  }
  c.goods = c.fac * n.st.sat / Math.max(0.05, c.pop / 1e6) / 2.5;
  const fossil = Math.max(0, 1 - n.nuke - n.renew - n.fusion);
  c.smog = clamp(c.fac * fossil * n.st.sat / Math.max(4, c.cells * 2.5), 0, 1);
  if (m.lab > 0) { const tl = c.pop / 1e6 * m.lab * 1.2; c.labs += (tl - c.labs) * 0.04; }
  c.rp = Math.pow(c.pop / 1e5, 0.7) * 0.12 * m.sci * (1 + Math.sqrt(c.labs) * 0.25) * (1 + 0.3 * Math.min(1, c.goods)) * (n.golden > 0 ? 1.5 : 1);
  // land use: clear forests under population pressure, regrow with green tech
  if (c.pop > 0.6 * K && rand() < 0.12) {
    const i = randomOwnedCell(c);
    const floor = WORLD.forest0[i] * (m.ind > 0 ? 0.25 : 0.45);
    if (i >= 0 && S.forest[i] > floor + 0.01) { const d = Math.min(S.forest[i] - floor, 0.025 * (m.ind > 0 ? 1.6 : 1)); S.forest[i] -= d; S.deforest += d; markDirty(i); }
  }
  if ((m.renew || m.ccs) && rand() < 0.35) {
    const i = randomOwnedCell(c);
    if (i >= 0 && S.forest[i] < WORLD.forest0[i]) { S.forest[i] = Math.min(WORLD.forest0[i], S.forest[i] + 0.02 * (m.ccs ? 2 : 1)); markDirty(i); }
  }
  // settlers
  if (S.cities.length < MAX_CITIES && c.pop > 0.45 * K && c.pop > 120000 && rand() < 0.035) trySettle(c, n);
}

function randomOwnedCell(c) {
  const R = Math.ceil(cityRadius(c));
  for (let k = 0; k < 6; k++) {
    const dy = Math.round((rand() * 2 - 1) * R), y = c.y + dy; if (y < 0 || y >= H) continue;
    const rx = R / Math.max(COSLAT[y], 0.25);
    const i = y * W + (c.x + Math.round((rand() * 2 - 1) * rx) + W) % W;
    if (S.cityOf[i] >= 0 && S.cities[S.cityOf[i]] === c && isLand(i)) return i;
  }
  return -1;
}

function trySettle(c, n) {
  const m = n.mult;
  let bestI = -1, bs = -1e9, viaSea = false;
  for (let k = 0; k < 22; k++) {
    const sea = m.sea > 0 && c.coastal && rand() < 0.45;
    const R = sea ? m.sea : m.range;
    const dy = Math.round((rand() * 2 - 1) * R), y = c.y + dy;
    if (y < 1 || y >= H - 1) continue;
    const rx = R / Math.max(COSLAT[y], 0.3);
    const i = y * W + (c.x + Math.round((rand() * 2 - 1) * rx) + W) % W;
    if (!isLand(i)) continue;
    const own = S.owner[i];
    if (own !== -1 && own !== n.id) continue;
    const b = WORLD.biome[i];
    if (b === B.MOUNTAIN || (b === B.ICE && cellTeff(i) < -9)) continue;
    const f = fertEff(i, m);
    let rs = 0; for (const r of RES) if (S.res[r][i] > 0) rs += 1;
    if (f < 0.12 && rs === 0) continue;
    const coast = isCoastal(i);
    if (sea && !coast) continue;
    let ok = true;
    for (const o of S.cities) { if (Math.abs(o.y - y) < 4 && cellDist(o.i, i) < 3.3) { ok = false; break; } }
    if (!ok) continue;
    const d = cellDist(c.i, i);
    const s = f * 1.6 + rs * 0.25 + (coast ? 0.25 : 0) + (own === -1 ? 0.35 : 0) - d / R * 0.25 + rand() * 0.25;
    if (s > bs) { bs = s; bestI = i; viaSea = sea && d > m.range; }
  }
  if (bestI < 0) return;
  const take = Math.min(c.pop * 0.25, 45000 + rand() * 30000);
  c.pop -= take;
  const nc = createCity(bestI, n.id, take, false);
  if (viaSea && !n.colony) { n.colony = 1; log('civ', `${n.name}的船队跨海建立了第一块殖民地「${nc.name}」`, bestI, false); }
}

function pickTech(n) {
  const avail = TECHS.filter(t => n.techs[t.id] === undefined && t.req.every(r => n.techs[r] !== undefined));
  if (!avail.length) return null;
  let minEra = 9; for (const t of avail) minEra = Math.min(minEra, t.era);

    if (m.orbital) { S.orbital = Math.min(1, S.orbital + 0.01); S.orbPop = Math.min(3e8, S.orbPop + 4e5 + S.orbPop * 0.01); }

/* =====================================================================
   Main loop
   ===================================================================== */
let playing = true, speed = 'auto', budget = 0, lastT = 0, lastLights = -1e9, lastRecolor = 0, lastUI = 0, lastSlowUI = 0, lastLayerRefresh = 0;
let booting = false, techVersion = 0;
const AUTO_SPEED = [60, 45, 32, 20, 8, 5, 3.5, 3.5];

function frame(t) {
  const dt = Math.min(0.1, (t - lastT) / 1000 || 0);
  lastT = t;
  animT += dt;
  if (playing && S) {
    const ys = speed === 'auto' ? AUTO_SPEED[S.flags.maxEra || 0] : speed;
    budget += ys * dt;
    let steps = 0;
    const maxSteps = 6;
    while (budget >= 1 && steps < maxSteps) { tick(); budget -= 1; steps++; }
    if (budget > 2) budget = 2;
    if (steps && S.terrDirty) territory();
  }
  if (dirtyList.length && t - lastRecolor > 100) { flushDirty(); lastRecolor = t; }
  if ((layer === 3 || layer === 4) && t - lastLayerRefresh > 1500) { recolorAll(); lastLayerRefresh = t; }
  if (t - lastLights > 450) { buildLights(); lastLights = t; }
  if (autoSpin && !drag) view.rot -= dt * 0.07;
  if (!reducedMotion) { cloudOff += dt * 0.0035; moonA += dt * 0.03; }
  renderGlobe();
  drawFrame();
  if (t - lastUI > 200) { updateHeader(); updateInspector(); lastUI = t; }
  if (t - lastSlowUI > (playing && speed !== 'auto' && speed > 20 ? 400 : 900)) { updatePanels(); lastSlowUI = t; }
  requestAnimationFrame(frame);
}

for (const key in CHARTS) {

/* ---------- pointer ---------- */
let drag = null;
const pointers = new Map();
function pickCity(sx, sy) {

    return;

window.addEventListener('keydown', e => {
  if (e.target.matches('input,select,textarea')) return;
  if (e.code === 'Space' && !e.target.closest('button')) { e.preventDefault(); setPlaying(!playing); }
  if (e.key === 'Escape') { if (tool) setTool(null); else { selected = null; updateInspector(true); } }
});
window.addEventListener('resize', () => { layout(); });

/* =====================================================================
   Snapshot / boot
   ===================================================================== */
function serialize() {
  const sparse = a => { const out = []; for (let i = 0; i < a.length; i++) if (a[i] > 0) out.push(i, Math.round(a[i] * 10) / 10); return out; };
  const res = {}; for (const r of RES) res[r] = sparse(S.res[r]);
  return {
    v: 1, seed: S.seed, year: S.year, tick: S.tick, rng: S.rng, co2: S.co2, tanom: S.tanom, seaRise: S.seaRise, co2Peak: S.co2Peak,
    cities: S.cities, wars: S.wars, log: S.log.slice(0, 200), history: S.history, firsts: S.firsts, names: S.names, flags: S.flags,
    nations: S.nations.map(n => { const { mult, dep, cl, ...rest } = n; return rest; }),
    forest: Array.from(S.forest, v => Math.round(v * 100) / 100), res, resLeft: S.resLeft,
    nextCity: S.nextCity, sats: S.sats, orbital: S.orbital, orbPop: S.orbPop, ships: S.ships, moon: S.moon, moonDue: S.moonDue, moonBy: S.moonBy,
    forestFrac: S.forestFrac, lastShip: S.lastShip,
    ui: { layer, speed, playing, rot: view.rot, pitch: view.pitch, zoom: view.zoom, activeTab },
  };
}
function deserialize(d) {
  WORLD = genWorld(d.seed);
  S = {
    v: 1, seed: d.seed, year: d.year, tick: d.tick, rng: d.rng, co2: d.co2, tanom: d.tanom, seaRise: d.seaRise, co2Peak: d.co2Peak,
    cities: d.cities, wars: d.wars, log: d.log, history: d.history, firsts: d.firsts, names: d.names, flags: d.flags,
    nations: d.nations.map(n => { n.mult = null; n.dep = { coal: [], oil: [], iron: [], uran: [], rare: [] }; n.cl = []; return n; }),
    forest: Float32Array.from(d.forest), res: {}, owner: new Int16Array(N).fill(-1), cityOf: new Int16Array(N).fill(-1),
    farm: new Float32Array(N), smog: new Float32Array(N), resLeft: d.resLeft,
    nextCity: d.nextCity, sats: d.sats, orbital: d.orbital, orbPop: d.orbPop, ships: d.ships, moon: d.moon, moonDue: d.moonDue, moonBy: d.moonBy,
    forestFrac: d.forestFrac, deforest: 0, terrDirty: true, borders: [], lastShip: d.lastShip,
  };
  for (const n of S.nations) n.mult = computeMult(n);
  for (const r of RES) { const a = new Float32Array(N); const s = d.res[r]; for (let k = 0; k < s.length; k += 2) a[s[k]] = s[k + 1]; S.res[r] = a; }
}

function boot(data) {
  booting = true;
  let restored = false;
  if (data && data.state && data.state.v === 1) {
    try { deserialize(data.state); restored = true; } catch (err) { restored = false; }
  }
  if (!restored) newState(data && data.seed ? data.seed : ((Math.random() * 1e9) | 0));
  buildGlobalDep();
  lastRiseDrawn = S.seaRise; lastTanomDrawn = S.tanom;
  S.flags.maxEra = S.flags.maxEra || 0;
  territory();
  if (!restored) { for (let k = 0; k < 420; k++) tick(); }
  const ui = restored && data.state.ui;
  if (ui) {
    layer = ui.layer; speed = ui.speed; view.rot = ui.rot; view.pitch = ui.pitch; view.zoom = ui.zoom;
    for (const x of $('layerSeg').children) x.setAttribute('aria-pressed', +x.dataset.layer === layer);
    for (const x of $('speedSeg').children) x.setAttribute('aria-pressed', String(x.dataset.speed) === String(speed));
    setPlaying(ui.playing);
  } else setPlaying(true);
  territory();
  recolorAll();
  buildLights();
  booting = false;
  selected = null; selectedNation = -1; expandedNation = -1;
  FX.length = 0; SMOKE.length = 0; SHIPS.length = 0;
  $('seedLabel').textContent = S.seed;
  renderLegend();
  layout();
  updateHeader();
  techVersion++; logVersion++;
  updatePanels();
}

function start(data) {
  readCss();
  boot(data && data.state ? data : null);
  window.claude?.hot?.snapshot?.(() => ({ state: serialize() }));
  requestAnimationFrame(t => { lastT = t; requestAnimationFrame(frame); });
}

// debugging handle (harmless in production)
window.__earth = { get S() { return S; }, tick: n => { for (let k = 0; k < n; k++) tick(); }, serialize, TECHS, newWorld: seed => boot({ seed }) };

if (window.claude?.hot?.ready) window.claude.hot.ready(start);
else start(window.claude?.hot?.data ?? {});
})();
</script>
